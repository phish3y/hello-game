[package]
name = "hello-game"
version = "0.1.0"
edition = "2021"

[profile.release]
strip = true

[dependencies]
bytemuck = { version = "1.16", features = [ "derive" ] }
cfg-if     = "1"
env_logger = "0.10"
log        = "0.4"
pollster   = "0.4.0"
winit      = { version  = "0.29", features = ["android-native-activity"] }
wgpu       = "25.0"
